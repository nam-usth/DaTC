[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "datc"
version = "1.0.0"
description = "Darboux Turn Code: matching thin-shell fragments by their fracture rims (RIVF 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyvista>=0.43", "numba>=0.57", "scikit-learn>=1.2"]

[project.optional-dependencies]
app = ["PyQt5>=5.15", "pyvistaqt>=0.11", "matplotlib>=3.6", "imageio>=2.30"]

[tool.setuptools.packages.find]
where = ["src"]
